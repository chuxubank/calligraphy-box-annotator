[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calligraphy-box-annotator"
version = "0.1.0"
description = "Local tool for boxing single characters on calligraphy plates."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "chuxubank" }]
dependencies = ["pillow>=10.0.0", "genanki>=0.13.1"]

[project.urls]
Homepage = "https://github.com/AsahiArt/calligraphy-box-annotator"

[project.scripts]
cba = "cba.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["cba", "tools"]

[tool.hatch.build.targets.wheel.force-include]
"boxannotator.py" = "boxannotator.py"
"serve.py" = "serve.py"
"crop_glyphs.py" = "crop_glyphs.py"
"web" = "cba/web"
"examples/demo" = "cba/demo"

[tool.hatch.build.targets.sdist]
include = [
  "cba",
  "tools",
  "web",
  "examples/demo",
  "boxannotator.py",
  "serve.py",
  "crop_glyphs.py",
  "README.md",
  "LICENSE",
  "AGENTS.md",
  "requirements.txt",
  "pyproject.toml",
]
